<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1714">
<meta name="color-scheme" content="dark">
<link rel="preload" href="{{ '/assets/fonts/instrument-serif.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
{% feed_meta %}
{% seo %}
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% unless page.hero %}{% include nav.html %}{% endunless %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
{% for s in page.scripts %}<script src="{{ s | relative_url }}" defer></script>
{% endfor %}
</body>
</html>
